[project]
name = "diwan"
version = "0.0.1"
description = "An agent runtime that keeps a permanent record of everything your agent does, and speaks every model's language."
readme = "README.md"
authors = [
    { name = "Zine-Elabidine LAABOUDI", email = "zine.elabidine251@gmail.com" }
]
requires-python = ">=3.13"   # Path.full_match (glob)
dependencies = [
    "rich>=15.0.0",
    "tarjuman",
    "textual>=8.2.8",
]

[project.scripts]
diwan = "diwan.cli:main"

[tool.uv.sources]
tarjuman = { path = "../tarjuman", editable = true }

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "RUF", "PL"]
ignore = [
    "PLR2004",            # magic numbers: limits are named where they matter
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917",  # complexity is tracked in reviews
    "PLC0415",            # lazy imports are deliberate (the TUI loads only when used)
    "RUF001",             # typographic characters in UI strings are intended
    "SIM105",             # try/except/pass reads fine
]

[tool.pyright]
include = ["src"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
